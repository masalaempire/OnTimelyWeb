name: Website checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check source
        run: npm run check
      - name: Build the website
        run: npm run build
      - name: Install verification tools on GitHub
        run: npm install --no-save --ignore-scripts @playwright/test@1.56.1 wrangler@4
      - name: Check Cloudflare packaging
        run: npx wrangler deploy --dry-run
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile
        run: npm test
      - name: Save browser previews and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: |
            test-results/
            playwright-report/
          retention-days: 7
